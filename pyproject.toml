[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvserve-lab"
version = "0.1.0"
description = "An auditable CPU inference lab for KV allocation and request scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["httpx>=0.27,<1", "fastapi>=0.115,<1", "matplotlib>=3.8,<4"]

[project.scripts]
kvserve = "kvserve.cli:main"

[tool.setuptools.packages.find]
include = ["kvserve*"]
